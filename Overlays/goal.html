<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GiftDeck goal</title>
<style>
  :root { --accent: #7C5CFF; --font: 'Segoe UI'; }
  body { margin: 0; background: transparent; font-family: var(--font), 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
  .goal { margin: 16px; padding: 14px 20px; background: rgba(15, 17, 23, .82); border-radius: 18px; box-shadow: 0 6px 28px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 16px; }
  .title { font-size: 28px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nums { font-size: 22px; font-weight: 600; opacity: .95; white-space: nowrap; }
  .bar { height: 24px; background: rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #22d3ee); border-radius: 12px; transition: width .9s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 18px var(--accent); }
  .pct { position: absolute; inset: 0; text-align: center; line-height: 24px; font-size: 14px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .done .title::after { content: '  GOAL!'; color: #fbbf24; }
  .done .fill { background: linear-gradient(90deg, #fbbf24, #f97316); box-shadow: 0 0 22px #fbbf24; }
  .bump { animation: bump .5s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="goal" id="goal">
  <div class="top"><div class="title" id="title">Loading</div><div class="nums" id="nums"></div></div>
  <div class="bar"><div class="fill" id="fill"></div><div class="pct" id="pct"></div></div>
</div>
<script>
  const id = location.pathname.split('/').filter(Boolean).pop();
  const $ = s => document.getElementById(s);
  let last = -1;
  function render(s) {
    document.documentElement.style.setProperty('--accent', s.style.accent);
    document.documentElement.style.setProperty('--font', "'" + s.style.font + "'");
    const g = s.goals.find(x => x.id === id) || s.goals[0];
    if (!g) { $('title').textContent = 'No goal set up in GiftDeck'; return; }
    const pct = Math.min(100, Math.round(100 * g.progress / g.target));
    $('title').textContent = g.title;
    $('nums').textContent = g.progress.toLocaleString() + ' / ' + g.target.toLocaleString();
    $('fill').style.width = pct + '%';
    $('pct').textContent = pct + '%';
    $('goal').classList.toggle('done', g.progress >= g.target);
    if (last >= 0 && g.progress !== last) { const el = $('goal'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    last = g.progress;
  }
  const es = new EventSource('/events');
  es.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') render(m); };
</script>
</body>
</html>
