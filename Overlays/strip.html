<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GiftDeck top gifters</title>
<style>
  :root { --accent: #7C5CFF; --font: 'Segoe UI'; }
  body { margin: 0; background: transparent; font-family: var(--font), 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
  .strip { margin: 8px; display: flex; align-items: stretch; background: rgba(15, 17, 23, .86); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.5), 0 0 0 2px var(--accent); overflow: hidden; height: 72px; }
  .title { flex: none; display: flex; align-items: center; padding: 0 14px; background: var(--accent); font-size: 15px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; writing-mode: horizontal-tb; max-width: 110px; line-height: 1.1; text-align: center; }
  .title:empty { display: none; }
  .top { flex: 1.6; display: flex; min-width: 0; }
  .g { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-left: 1px solid rgba(255,255,255,.08); }
  .g:first-child { border-left: none; }
  .medal { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #1f1300; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .m1 { background: linear-gradient(#fde68a, #f59e0b); }
  .m2 { background: linear-gradient(#f1f5f9, #94a3b8); }
  .m3 { background: linear-gradient(#fdba74, #c2410c); }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .who { min-width: 0; }
  .name { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .coins { font-size: 14px; color: #fbbf24; font-weight: 700; }
  .none { opacity: .45; font-size: 15px; }
  .goal { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 14px; border-left: 2px solid var(--accent); }
  .goal:empty { display: none; }
  .gt { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; }
  .gt span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 14px; background: rgba(255,255,255,.14); border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #22d3ee); border-radius: 7px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .done .fill { background: linear-gradient(90deg, #fbbf24, #f97316); }
</style>
</head>
<body>
<div class="strip">
  <div class="title" id="title"></div>
  <div class="top" id="top"></div>
  <div class="goal" id="goal"></div>
</div>
<script>
  const $ = s => document.getElementById(s);
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  let lastTop = '';
  function render(s) {
    document.documentElement.style.setProperty('--accent', s.style.accent);
    document.documentElement.style.setProperty('--font', "'" + s.style.font + "'");
    const st = s.strip;
    if (!st) return;
    $('title').textContent = st.title || '';
    const topJson = JSON.stringify(st.top);
    if (topJson !== lastTop) {
      lastTop = topJson;
      const cells = [];
      for (let i = 0; i < 3; i++) {
        const g = st.top[i];
        const medal = '<div class="medal m' + (i + 1) + '">' + (i + 1) + '</div>';
        if (!g) { cells.push('<div class="g">' + medal + '<div class="who"><div class="name none">—</div></div></div>'); continue; }
        const av = g.avatar ? '<img class="av" src="' + esc(g.avatar) + '" onerror="this.remove()">' : '';
        cells.push('<div class="g">' + medal + av + '<div class="who"><div class="name">' + esc(g.name) + '</div><div class="coins">'
          + g.coins.toLocaleString() + (g.coins === 1 ? ' coin' : ' coins') + '</div></div></div>');
      }
      $('top').innerHTML = cells.join('');
    }
    const goal = st.goal;
    if (!goal) { $('goal').innerHTML = ''; return; }
    const pct = Math.min(100, Math.round(100 * goal.progress / Math.max(1, goal.target)));
    if (!$('goal').querySelector('.fill'))
      $('goal').innerHTML = '<div class="gt"><span id="gname"></span><span id="gnum"></span></div><div class="bar"><div class="fill" id="gfill"></div></div>';
    $('gname').textContent = 'Next: ' + goal.title;
    $('gnum').textContent = goal.progress.toLocaleString() + ' / ' + goal.target.toLocaleString();
    $('gfill').style.width = pct + '%';
    $('goal').classList.toggle('done', goal.progress >= goal.target);
  }
  const es = new EventSource('/events');
  es.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') render(m); };
</script>
</body>
</html>
