<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MayhemDeck counter</title>
<style>
  :root { --accent: #7C5CFF; --font: 'Segoe UI'; }
  body { margin: 0; background: transparent; font-family: var(--font), 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
  .card { display: inline-flex; align-items: center; gap: 16px; margin: 16px; padding: 12px 22px 12px 16px; background: rgba(15, 17, 23, .82); border-radius: 18px; box-shadow: 0 6px 28px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), #22d3ee); display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .label { font-size: 15px; font-weight: 600; opacity: .8; letter-spacing: .04em; text-transform: uppercase; }
  .num { font-size: 40px; font-weight: 800; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .bump { animation: bump .45s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon"></div>
  <div><div class="label" id="label"></div><div class="num" id="num">0</div></div>
</div>
<script>
  const metric = (location.pathname.split('/').filter(Boolean).pop() || 'follows').toLowerCase();
  const labels = { follows: ['New followers', '❤'], likes: ['Likes', '👍'], shares: ['Shares', '🔁'], coins: ['Coins', '🪙'], gifts: ['Gifts', '🎁'], viewers: ['Watching now', '👁'] };
  const $ = s => document.getElementById(s);
  const info = labels[metric] || ['Count', '#'];
  $('label').textContent = info[0];
  $('icon').textContent = info[1];
  let shown = 0, target = 0, anim = null;
  function animate() {
    if (shown === target) { anim = null; return; }
    const step = Math.max(1, Math.ceil(Math.abs(target - shown) / 12));
    shown += shown < target ? step : -step;
    if ((step > 0 && shown > target) || (step < 0 && shown < target)) shown = target;
    $('num').textContent = shown.toLocaleString();
    anim = requestAnimationFrame(animate);
  }
  function render(s) {
    document.documentElement.style.setProperty('--accent', s.style.accent);
    document.documentElement.style.setProperty('--font', "'" + s.style.font + "'");
    const v = s.stats[metric] || 0;
    if (v !== target) {
      target = v;
      const el = $('card'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      if (!anim) animate();
    }
  }
  const es = new EventSource('/events');
  es.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') render(m); };
</script>
</body>
</html>
