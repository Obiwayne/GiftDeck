<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MayhemDeck Gift Spinner</title>
<style>
  :root { --accent: #7C5CFF; --font: 'Segoe UI'; --win: #F59E0B; --size: 560px; }
  html, body { height: 100%; }
  body { margin: 0; background: transparent; font-family: var(--font), 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .5s; }
  .stage.hidden { opacity: 0; }
  .who { font-size: calc(var(--size) * .06); font-weight: 700; text-shadow: 0 3px 10px rgba(0,0,0,.8); margin-bottom: calc(var(--size) * .08); min-height: 1.3em; text-align: center; padding: 0 12px; }
  .who b { color: #fbbf24; }
  .wheelBox { position: relative; width: var(--size); height: var(--size); }
  .rays { position: absolute; inset: -18%; border-radius: 50%; opacity: 0; background: repeating-conic-gradient(from 0deg, var(--win) 0deg 8deg, transparent 8deg 24deg); -webkit-mask: radial-gradient(circle, transparent 38%, #000 40%, transparent 70%); mask: radial-gradient(circle, transparent 38%, #000 40%, transparent 70%); }
  .big .rays { animation: rays 6s linear infinite, raysIn .6s ease-out forwards; }
  @keyframes rays { to { transform: rotate(360deg); } }
  @keyframes raysIn { to { opacity: .75; } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 12px 50px rgba(0,0,0,.6), 0 0 0 calc(var(--size) * .018) rgba(15,17,23,.92), 0 0 0 calc(var(--size) * .026) var(--accent); }
  .pointer { position: absolute; left: 50%; top: calc(var(--size) * -.045); transform: translateX(-50%); width: 0; height: 0; border-left: calc(var(--size) * .05) solid transparent; border-right: calc(var(--size) * .05) solid transparent; border-top: calc(var(--size) * .1) solid #fff; filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); z-index: 3; }
  .hub { position: absolute; left: 50%; top: 50%; width: 18%; height: 18%; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3a3f55, #0f1117 70%); box-shadow: 0 0 0 calc(var(--size) * .012) var(--accent), 0 6px 18px rgba(0,0,0,.6); z-index: 2; display: flex; align-items: center; justify-content: center; font-size: calc(var(--size) * .05); font-weight: 800; }
  .reveal { position: absolute; left: 50%; bottom: 8%; transform: translate(-50%, 30px) scale(.85); opacity: 0; z-index: 4; min-width: 60%; max-width: 96%; text-align: center; padding: calc(var(--size) * .025) calc(var(--size) * .05); background: rgba(15,17,23,.92); border-radius: 18px; box-shadow: 0 0 0 3px var(--win), 0 0 40px var(--win); }
  .reveal.show { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) forwards; }
  @keyframes pop { to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  .tier { display: inline-block; font-size: calc(var(--size) * .032); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 2px 12px; border-radius: 999px; background: var(--win); color: #0f1117; }
  .prize { font-size: calc(var(--size) * .07); font-weight: 800; margin-top: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
  .flash { position: fixed; inset: 0; background: radial-gradient(circle, #fff 0%, var(--win) 45%, transparent 80%); opacity: 0; pointer-events: none; z-index: 5; }
  .flash.go { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
  .big .reveal.show { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) forwards, glow .8s ease-in-out .5s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 3px var(--win), 0 0 30px var(--win); } to { box-shadow: 0 0 0 5px var(--win), 0 0 90px var(--win); } }
  .empty { font-size: 20px; color: #ddd; text-shadow: 0 2px 6px #000; }
</style>
<script src="/lib/common.js"></script>
</head>
<body>
<div class="stage" id="stage">
  <div class="who" id="who"></div>
  <div class="wheelBox" id="box">
    <div class="rays"></div>
    <canvas id="wheel" width="1000" height="1000"></canvas>
    <div class="pointer"></div>
    <div class="hub" id="hub">?</div>
    <div class="reveal" id="reveal"><div class="tier" id="tier"></div><div class="prize" id="prize"></div></div>
  </div>
</div>
<div class="flash" id="flash"></div>
<script>
  const $ = s => document.getElementById(s);
  const wantId = new URLSearchParams(location.search).get('id') || location.pathname.split('/').filter(Boolean)[2] || '';
  let entries = [], rotation = 0, spinning = false, hideIdle = false, myId = '', lastKey = '', timers = [];
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function fit() {
    const s = Math.max(160, Math.min(innerWidth * .92, (innerHeight - 20) / 1.22));
    document.documentElement.style.setProperty('--size', s + 'px');
  }
  addEventListener('resize', fit); fit();

  function shade(hex, f) {
    let h = String(hex || '#888').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16) || 0x888888;
    const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f));
    return 'rgb(' + c.join(',') + ')';
  }
  function draw() {
    const cv = $('wheel'), g = cv.getContext('2d'), R = cv.width / 2;
    g.clearRect(0, 0, cv.width, cv.height);
    if (!entries.length) return;
    const n = entries.length, a = Math.PI * 2 / n;
    for (let i = 0; i < n; i++) {
      const start = -Math.PI / 2 + i * a, e = entries[i];
      const grad = g.createRadialGradient(R, R, R * .1, R, R, R);
      grad.addColorStop(0, shade(e.color, .25)); grad.addColorStop(1, shade(e.color, -.25));
      g.beginPath(); g.moveTo(R, R); g.arc(R, R, R, start, start + a); g.closePath();
      g.fillStyle = grad; g.fill();
      g.strokeStyle = 'rgba(15,17,23,.85)'; g.lineWidth = 6; g.stroke();
      g.save(); g.translate(R, R); g.rotate(start + a / 2);
      g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
      const fs = Math.max(22, Math.min(54, 560 / Math.max(6, n) + 14));
      g.font = '800 ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
      g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 8;
      // An event's gift picture sits at the rim, with its name inside it.
      const pic = e.image && pics[e.image], hasPic = pic && pic.complete && pic.naturalWidth > 0;
      const ps = Math.min(R * .14, R * .8 * a * .75);
      let label = String(e.label || ''); const max = hasPic ? R * .9 - ps - R * .24 : R * .7;
      if (hasPic) for (let f = fs; f > fs * .7 && g.measureText(label).width > max; f -= 2) g.font = '800 ' + f + 'px ' + getComputedStyle(document.body).fontFamily;
      while (label.length > 1 && g.measureText(label).width > max) label = label.slice(0, -2) + '…';
      g.fillText(label, hasPic ? R * .88 - ps : R * .9, 0);
      if (hasPic) { g.shadowBlur = 10; g.drawImage(pic, R * .9 - ps, -ps / 2, ps, ps); }
      g.restore();
    }
  }
  const pics = {};
  function setEntries(list) {
    const key = JSON.stringify(list);
    if (key === lastKey) return;
    lastKey = key; entries = list;
    for (const e of list) if (e.image && !pics[e.image]) { const im = new Image(); im.onload = draw; im.src = e.image; pics[e.image] = im; }
    draw();
  }
  function idle() {
    $('stage').classList.toggle('hidden', hideIdle && !spinning);
  }
  function spin(m) {
    timers.forEach(clearTimeout);
    spinning = true; idle();
    setEntries(m.entries);
    const n = m.entries.length, a = 360 / n, win = m.entries[m.index] || {};
    document.body.classList.remove('big');
    $('reveal').classList.remove('show');
    $('hub').textContent = '?';
    $('who').innerHTML = m.user ? 'Spinning for <b>' + esc(m.user) + '</b>' : 'Spinning…';
    // Land the chosen slice under the pointer, somewhere inside it (not always dead centre).
    const jitter = (Math.random() - .5) * a * .7;
    let target = -((m.index + .5) * a) + jitter;
    let delta = ((target - rotation) % 360 + 360) % 360;
    rotation += 360 * (4 + Math.round(m.seconds / 2)) + delta;
    const cv = $('wheel');
    cv.style.transition = 'transform ' + m.seconds + 's cubic-bezier(.12,.7,.1,1)';
    cv.style.transform = 'rotate(' + rotation + 'deg)';
    timers = [setTimeout(() => {
      const color = win.color || '#F59E0B', rarity = String(win.rarity || 'common');
      document.documentElement.style.setProperty('--win', color);
      $('tier').textContent = rarity;
      $('prize').textContent = win.label || '';
      $('hub').textContent = '!';
      $('reveal').classList.add('show');
      if (rarity === 'epic' || rarity === 'legendary') {
        document.body.classList.add('big');
        const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      }
    }, m.seconds * 1000 + 50),
    setTimeout(() => {
      spinning = false;
      $('reveal').classList.remove('show');
      document.body.classList.remove('big');
      $('who').textContent = '';
      $('hub').textContent = '?';
      idle();
    }, m.seconds * 1000 + Math.max(1500, m.revealMs || 1800) + 2500)];
  }
  function state(s) {
    document.documentElement.style.setProperty('--accent', s.style.accent);
    document.documentElement.style.setProperty('--font', "'" + s.style.font + "'");
    // ?id=any (the all-in-one page): show whichever spinner spins; the first one in between.
    const sp = (s.spinners || []).find(x => x.id === wantId) || (!wantId || wantId === 'any' ? (s.spinners || [])[0] : null);
    if (!sp) { $('who').innerHTML = '<span class="empty">No spinner set up in MayhemDeck</span>'; setEntries([]); return; }
    myId = sp.id; hideIdle = !!sp.hideWhenIdle || GD.param('idle') === 'hide';
    if (!spinning) { setEntries(sp.entries); if ($('who').querySelector('.empty')) $('who').textContent = ''; }
    idle();
  }
  GD.listen(m => {
    if (m.type === 'state') state(m);
    else if (m.type === 'spin' && (m.spinner === myId || m.spinner === wantId || wantId === 'any')) spin(m);
  });
</script>
</body>
</html>
