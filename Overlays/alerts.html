<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GiftDeck alerts</title>
<style>
  :root { --accent: #7C5CFF; --font: 'Segoe UI'; }
  body { margin: 0; background: transparent; font-family: var(--font), 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .alert { display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 18px; background: rgba(15, 17, 23, .86); border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 2px var(--accent); max-width: 90%; opacity: 0; transform: translateY(30px) scale(.9); }
  .alert.in { animation: pop .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
  .alert.out { animation: fade .4s ease-in forwards; }
  @keyframes pop { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fade { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-20px) scale(.95); } }
  .img { width: 96px; height: 96px; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,.6)); animation: wiggle 1.2s ease-in-out infinite; }
  .img.avatar { border-radius: 50%; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(6deg) scale(1.08); } }
  .text { font-size: 30px; font-weight: 600; line-height: 1.25; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .text b { color: #fbbf24; }
  .sub { font-size: 20px; opacity: .85; margin-top: 4px; }
  .count { color: #22d3ee; font-weight: 800; }
  /* Custom alerts (Overlays page > Alerts and interrupts): a picture or video with a line of text. */
  .alert.custom { flex-direction: column; gap: 12px; padding: 18px 26px; text-align: center; }
  .alert.custom .media { max-width: 100%; max-height: 62vh; border-radius: 12px; object-fit: contain; }
  .alert.custom .text { font-size: 34px; }
  .alert.full { position: absolute; inset: 0; max-width: none; border-radius: 0; padding: 0; background: #000; box-shadow: none; justify-content: center; }
  .alert.full .media { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; border-radius: 0; object-fit: cover; }
  .alert.full .text { position: absolute; left: 0; right: 0; bottom: 6%; font-size: 48px; font-weight: 800; }
  .alert.full.in { animation: flashIn .25s ease-out forwards; }
  @keyframes flashIn { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: scale(1); } }
  /* Green-screen videos: the keyed canvas floats on the stream, so no card behind it. */
  .alert.keyed, .alert.full.keyed { background: transparent; box-shadow: none; }
  .alert .src { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>
<script src="/lib/common.js"></script>
<script src="/lib/chroma.js"></script>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  const $ = s => document.getElementById(s);
  let seconds = 6, queue = [], busy = false;
  function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  let current = null, timers = [];
  // ?pos=top, bottomLeft, ... (the all-in-one page): where alert cards appear. Full-screen alerts still fill it all.
  const pos = GD.param('pos');
  if (pos) {
    const w = $('wrap');
    w.style.alignItems = /^top/i.test(pos) ? 'flex-start' : /^bottom/i.test(pos) ? 'flex-end' : 'center';
    w.style.justifyContent = /left$/i.test(pos) ? 'flex-start' : /right$/i.test(pos) ? 'flex-end' : 'center';
    w.style.padding = '3%';
  }
  // A custom alert: GiftDeck has already filled in {user}, {gift} and {count}; media is a picture or a video.
  function customAlert(a) {
    const el = document.createElement('div');
    el.className = 'alert custom in' + (a.fullScreen ? ' full' : '');
    let media = '';
    const keyed = a.media && a.mediaType === 'video' && a.key && window.GDChroma;
    if (keyed) media = '<video class="src" src="' + esc(a.media) + '" playsinline></video><canvas class="media"></canvas>';
    else if (a.media && a.mediaType === 'video') media = '<video class="media" src="' + esc(a.media) + '" autoplay playsinline></video>';
    else if (a.media) media = '<img class="media" src="' + esc(a.media) + '">';
    el.innerHTML = media + (a.text ? '<div class="text">' + esc(a.text) + '</div>' : '');
    const v = el.querySelector('video');
    if (keyed) {
      el.classList.add('keyed');
      // Green screen: draw the video through the chroma key. If it can't be keyed, show it as it is.
      GDChroma.attach(v, el.querySelector('canvas'), a.key, err => {
        console.warn('Green screen removal failed, showing the video as it is', err);
        const c = el.querySelector('canvas');
        if (c) c.remove();
        v.className = 'media';
        el.classList.remove('keyed');
      });
    }
    // OBS plays the video's own sound; a browser that blocks sound autoplay still gets the picture.
    if (v) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
    return el;
  }
  function show(a) {
    busy = true;
    if (a.kind === 'custom') {
      const secs = Math.max(1, a.seconds || seconds), el = customAlert(a);
      current = el;
      $('wrap').appendChild(el);
      timers = [setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); }, secs * 1000),
                setTimeout(() => { el.remove(); current = null; busy = false; next(); }, secs * 1000 + 450)];
      return;
    }
    const el = document.createElement('div');
    el.className = 'alert in';
    let img = '';
    if (a.image) img = '<img class="img" src="' + esc(a.image) + '">';
    else if (a.avatar) img = '<img class="img avatar" src="' + esc(a.avatar) + '">';
    let text, sub = '';
    if (a.kind === 'gift') {
      text = '<b>' + esc(a.user) + '</b> sent ' + esc(a.gift) + (a.count > 1 ? ' <span class="count">x' + a.count + '</span>' : '');
      sub = a.coins.toLocaleString() + (a.coins === 1 ? ' coin' : ' coins') + ' — thank you!';
    } else if (a.kind === 'follow') { text = '<b>' + esc(a.user) + '</b> just followed!'; sub = 'Welcome to the stream'; }
    else if (a.kind === 'share') { text = '<b>' + esc(a.user) + '</b> shared the LIVE!'; sub = 'Thanks for spreading the word'; }
    else text = esc(a.user);
    el.innerHTML = img + '<div><div class="text">' + text + '</div>' + (sub ? '<div class="sub">' + esc(sub).replace('&amp;', '&') + '</div>' : '') + '</div>';
    $('wrap').appendChild(el);
    current = el;
    timers = [setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); }, seconds * 1000),
              setTimeout(() => { el.remove(); current = null; busy = false; next(); }, seconds * 1000 + 450)];
  }
  // An interrupt goes on straight away, cutting off whatever was showing; the line carries on after it.
  function interrupt(a) {
    timers.forEach(clearTimeout);
    if (current) current.remove();
    current = null; busy = false;
    show(a);
  }
  function next() { if (!busy && queue.length) show(queue.shift()); }
  GD.listen(m => {
    if (m.type === 'state') {
      seconds = Math.max(2, m.style.alertSeconds || 6);
      document.documentElement.style.setProperty('--accent', m.style.accent);
      document.documentElement.style.setProperty('--font', "'" + m.style.font + "'");
    } else if (m.type === 'alert' && m.interrupt) interrupt(m);
    else if (m.type === 'alert') { queue.push(m); if (queue.length > 20) queue.shift(); next(); }
  });
</script>
</body>
</html>
