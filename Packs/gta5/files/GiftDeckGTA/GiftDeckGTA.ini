; GiftDeck GTA settings. The F10 menu changes the notification settings for you.

[GameLink]
; Where GiftDeck listens. Host and port are separate because SHVDN's ini reader mangles "ws://" addresses.
Host=127.0.0.1
Port=21216

[Menu]
; Any key name from https://learn.microsoft.com/dotnet/api/system.windows.forms.keys (F10, F9, NumPad0...)
Key=F10

[Notifications]
; "{user} sent {gift}: {command}" on screen for every gift
ShowGifts=true
; A note when GiftDeck connects or disconnects
ShowConnection=true
; The green "GiftDeck GTA ready" text when Story Mode loads
ShowGreeting=true
